<!doctype html>
<html lang="en">
  <head>
    <title>trimpsuz.dev</title>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('theme');
          const theme = stored === 'dark' || stored === 'light' ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="trimpsuz.dev homepage" />
    <meta name="og:title" content="trimpsuz.dev" />
    <meta name="og:url" content="https://trimpsuz.dev/" />
    <meta name="og:type" content="website" />
    <meta name="og:locale" content="en_us" />
    <meta name="og:email" content="me@trimpsuz.dev" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
